name: Build Fripack .so

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Fripack
        run: cargo install --git https://github.com/std-microblock/fripack/

      - name: Verify agent.js
        run: |
          ls -la agent/agent.js
          wc -l agent/agent.js
          wc -c agent/agent.js

      - name: Build with Fripack
        run: fripack build so

      - name: List output
        run: ls -laR ./fripack_output/

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: fripack-so-android-arm64
          path: ./fripack_output/*.so
          if-no-files-found: error