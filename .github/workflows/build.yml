name: Build Fripack .so

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract Fripack binary
        run: |
          mkdir -p $HOME/fripack-bin
          cd $HOME/fripack-bin

          # دریافت اطلاعات آخرین نسخه از GitHub API
          RELEASE_JSON=$(curl -s https://api.github.com/repos/std-microblock/fripack/releases/latest)

          # استخراج URL دانلود با jq (فیلتر بر اساس linux و x64)
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[].browser_download_url | select(test("linux.*x64.*\\.zip"))' | head -n 1)

          # اگر URL پیدا نشد، خطا بده
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Could not find a Linux x64 asset in the latest release."
            echo "Available assets:"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -o fripack.zip "$DOWNLOAD_URL"

          # بررسی صحت فایل دانلود شده
          file fripack.zip
          ls -la fripack.zip

          unzip -o fripack.zip
          chmod +x fripack
          echo "$HOME/fripack-bin" >> $GITHUB_PATH

      - name: Verify agent.js
        run: |
          ls -la agent/agent.js
          wc -c agent/agent.js

      - name: Build .so with Fripack
        run: fripack build so

      - name: List output files
        run: ls -laR ./fripack_output/ || ls -laR ./fripack/ || true

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: fripack-so-android-arm64
          path: |
            ./fripack_output/*.so
            ./fripack/*.so
          if-no-files-found: error