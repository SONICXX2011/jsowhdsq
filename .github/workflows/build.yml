name: Build Native-Encrypted Fripack

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify inputs
        run: |
          ls -la agent/
          wc -c agent/agent.js agent/bootstrap.js

      - name: Encrypt agent.js
        run: node encrypt.js

      - name: Verify final.js
        run: |
          ls -la agent/final.js
          wc -c agent/final.js

      - name: Download Fripack binary
        run: |
          mkdir -p $HOME/fripack-bin
          cd $HOME/fripack-bin
          RELEASE_JSON=$(curl -s https://api.github.com/repos/std-microblock/fripack/releases/latest)
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[].browser_download_url | select(test("linux-gnu"))' | head -n 1)
          if [ -z "$DOWNLOAD_URL" ]; then echo "URL not found"; exit 1; fi
          curl -L -o fripack "$DOWNLOAD_URL"
          chmod +x fripack
          echo "$HOME/fripack-bin" >> $GITHUB_PATH

      - name: Build .so with Fripack
        run: fripack build so

      - name: Check output
        run: ls -laR ./fripack_output/ 2>/dev/null || true

      - name: Prepare final artifact
        run: |
          mkdir -p output
          cp fripack_output/*.so output/libsonic-xxxx.so
          printf '{"interaction":{"type":"script","path":"self"}}' > output/libsonic-xxxx.config.so
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fripack-all-in-one
          path: output/
          if-no-files-found: error