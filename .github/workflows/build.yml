name: Build Fripack .so

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Fripack binary
        run: |
          mkdir -p $HOME/fripack-bin
          cd $HOME/fripack-bin

          # دریافت اطلاعات آخرین نسخه
          RELEASE_JSON=$(curl -s https://api.github.com/repos/std-microblock/fripack/releases/latest)

          # استخراج URL فایل linux-gnu
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[].browser_download_url | select(test("linux-gnu"))' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Could not find Linux gnu asset"
            exit 1
          fi

          echo "Downloading: $DOWNLOAD_URL"
          curl -L -o fripack "$DOWNLOAD_URL"

          # بررسی
          file fripack
          ls -la fripack

          chmod +x fripack
          echo "$HOME/fripack-bin" >> $GITHUB_PATH

      - name: Verify Fripack
        run: |
          fripack --version || fripack --help || true

      - name: Verify agent.js
        run: |
          ls -la agent/agent.js
          wc -c agent/agent.js

      - name: Build .so with Fripack
        run: fripack build so

      - name: List output files
        run: |
          ls -laR ./fripack_output/ 2>/dev/null || true
          ls -laR ./fripack/ 2>/dev/null || true
          find . -name "*.so" -not -path "./.git/*" 2>/dev/null || true

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: fripack-so-android-arm64
          path: |
            ./fripack_output/*.so
            ./fripack/*.so
          if-no-files-found: error