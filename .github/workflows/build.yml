name: Build Frida Gadget with V8 (Android ARM64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3 \
            python3-pip \
            python3-venv \
            lib32stdc++-10-dev \
            libc6-dev-i386 \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libglib2.0-dev \
            libzip-dev \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Enable V8 in config.mk
        run: |
          if [ -f config.mk ]; then
            sed -i 's/^FRIDA_V8.*/FRIDA_V8 := enabled/' config.mk
          else
            echo "FRIDA_V8 := enabled" > config.mk
          fi
          cat config.mk

      - name: Configure with V8 enabled
        run: ./configure --host=android-arm64
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build Frida
        run: make

      - name: Upload frida-gadget
        uses: actions/upload-artifact@v4
        with:
          name: frida-gadget-android-arm64-v8
          path: build/frida-android-arm64/lib/frida-gadget.so
          if-no-files-found: error